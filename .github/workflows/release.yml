name: release

# 规则（见仓库约定）：manifest.json 的 version 就是发布号，
# tag 必须与它完全一致；推 main 之后这里负责把 Release 建出来并挂三件套。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: manifest
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists at HEAD
        env:
          V: ${{ steps.manifest.outputs.version }}
        run: |
          # checkout 出来的工作区没有 git 身份，git tag -a 会因为
          # "unable to auto-detect email address" 直接失败——必须先配。
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "tag $V already points somewhere; leaving it alone"
          else
            git tag -a "$V" -m "$V"
            git push origin "$V"
          fi

      - name: Check if this version already has a release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.manifest.outputs.version }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release $V already published; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          name: Screenplay MD ${{ steps.manifest.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            main.js
            manifest.json
            styles.css
